<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#050505">
  <title>Jarvis · RSM</title>
  <link rel="stylesheet" href="/jarvis/jarvis.css">
</head>
<body data-agent="jarvis" data-state="idle">
  <header class="top">
    <div class="brand">J.A.R.V.I.S <span>RSM</span></div>
    <nav class="agents" aria-label="Agents">
      <button type="button" data-agent="jarvis" aria-pressed="true">Jarvis</button>
      <button type="button" data-agent="scout" aria-pressed="false">Lead Scout</button>
      <button type="button" data-agent="strategist" aria-pressed="false">Strategist</button>
    </nav>
    <div class="who"><span id="who"></span><button type="button" id="logout">Log out</button></div>
  </header>

  <main class="stage">
    <section class="panel p1"><h2>Visitors this week</h2><div class="num" id="s-visits">—</div><div class="sub" id="s-visits-sub"></div></section>
    <section class="panel p2"><h2>New inquiries</h2><div class="num" id="s-inq">—</div><div class="sub">last 7 days</div></section>
    <section class="panel p3"><h2>Signed athletes</h2><div class="num" id="s-ath">—</div><div class="sub" id="s-ath-sub"></div></section>
    <section class="panel p4"><h2>Open deals</h2><div class="num" id="s-deals">—</div><div class="sub" id="s-deals-sub"></div></section>

    <div class="orb-wrap">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div class="agent-name" id="agent-name">Jarvis</div>
      <div class="status" id="status" role="status">Tap the mic or press space</div>
    </div>
  </main>

  <section class="transcript" id="transcript" aria-live="polite"></section>

  <footer class="controls">
    <form id="typeform" class="typeform" hidden>
      <input id="typed" type="text" placeholder="Type to Jarvis…" autocomplete="off" aria-label="Message">
      <button type="submit">Send</button>
    </form>
    <button type="button" id="mic" class="mic" aria-label="Talk"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    <button type="button" id="typetoggle" class="linkish">Type instead</button>
  </footer>

  <script type="module" src="/jarvis/jarvis.js"></script>
</body>
</html>
