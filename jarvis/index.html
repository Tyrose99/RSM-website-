<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#050505">
  <title>J.A.R.V.I.S · RSM</title>
  <link rel="stylesheet" href="/jarvis/jarvis.css">
</head>
<body class="jv" data-state="idle" data-speaker="jarvis" data-view="focus">
  <header class="jv-top">
    <div class="jv-brand">J.A.R.V.I.S <span>— RSM</span></div>
    <div class="jv-clock" aria-live="off"><span id="clock-time">--:--</span><span id="clock-date"></span></div>
    <div class="jv-user">
      <span class="jv-dot" id="status-dot" data-status="connecting" title="Connecting"></span>
      <span id="who"></span>
      <button type="button" class="jv-pill" id="play-brief" disabled title="Today's briefing">▶ Briefing</button>
      <button type="button" class="jv-pill" id="view-toggle" aria-pressed="false">Show full dashboard</button>
      <button type="button" class="jv-pill" id="logout">Log out</button>
    </div>
  </header>

  <main class="jv-stage" id="stage">
    <section class="jv-side jv-left" id="panels-left" aria-label="Answers"></section>
    <div class="jv-center">
      <div class="jv-core" id="core">
        <svg class="jv-rings" viewBox="0 0 400 400" aria-hidden="true">
          <g id="ring-a"><circle cx="200" cy="200" r="192" class="r-ticks"/><circle cx="200" cy="200" r="196" class="r-faint"/></g>
          <g id="ring-b"><circle cx="200" cy="200" r="176" class="r-arcs"/><circle cx="200" cy="200" r="168" class="r-ticks-fine"/></g>
          <g id="ring-c"><circle cx="200" cy="200" r="156" class="r-arcs-2"/><path d="M200 34 l5 9 h-10z" class="r-mark"/><path d="M200 366 l5 -9 h-10z" class="r-mark"/></g>
        </svg>
        <canvas id="orb" aria-hidden="true"></canvas>
        <div class="jv-speaker" id="speaker">Jarvis</div>
      </div>
    </div>
    <section class="jv-side jv-right" id="panels-right" aria-label="Answers"></section>
    <section class="jv-full" id="panels-full" aria-label="Full dashboard" hidden></section>
  </main>

  <footer class="jv-bottom">
    <div class="jv-transcript" aria-live="polite">
      <p class="jv-line" id="said"><span class="who">You</span><span class="txt" id="said-text">Tap the mic or press space, then ask me anything.</span></p>
      <p class="jv-line reply" id="reply" hidden><span class="who" id="reply-who">Jarvis</span><span class="txt" id="reply-text"></span></p>
    </div>
    <div class="jv-controls">
      <form id="typeform" class="jv-typeform" hidden>
        <input id="typed" type="text" placeholder="Type to Jarvis…" autocomplete="off" aria-label="Message to Jarvis">
        <button type="submit">Send</button>
      </form>
      <button type="button" id="mic" class="jv-mic" aria-label="Talk to Jarvis"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span class="jv-mic-label" id="mic-label">Talk</span></button>
      <button type="button" id="typetoggle" class="jv-link">Type instead</button>
    </div>
  </footer>

  <div class="jv-greet" id="greet" hidden role="dialog" aria-label="Today's briefing">
    <p id="greet-text">Good morning, sir. Here's your day.</p>
    <button type="button" class="jv-btn" id="greet-play">▶ Play briefing</button>
    <button type="button" class="jv-x" id="greet-close" aria-label="Dismiss">✕</button>
  </div>

  <script type="module" src="/jarvis/jarvis.js"></script>
</body>
</html>
